kind = "web"
previewPath = "/"
title = "Wasl"
description = "A private, culturally aware care-coordination app that helps Muslim elders, families, professional caregivers, and community companions coordinate everyday support with dignity and clear permissions."
version = "1.0.0"
id = "artifacts/wasl"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18619

[services.development]
run = "pnpm --filter @workspace/wasl run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wasl", "run", "build" ]
serve = "static"
publicDir = "artifacts/wasl/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18619"
BASE_PATH = "/"
